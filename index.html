<!DOCTYPE html>
<head>
<title> weather website</title>
<meta charset="UTF-8">
<link rel = "stylesheet" href = "styles.css">
</head>

<body>
    <div class= "card">
        <div class="search">
            <input type="text"  placeholder="Enter city name" spellcheck="false">
            <button > <img src = "images/search_icon.png"></button>
            <div class="weather">
            <img src = "images/rain_image.png" class = "weather_icon">
            <div class="temperature">25°C</div>
            <div class="description">Light Rain</div>

           <div class="details">
             <div class = "col 1"> 
                <img src="images/humidity_image.png">

                <div>
                    <p class="humidity"> 50%</p>
                    <p> humidity</p>
                </div>

             </div>
             <div class = "col 1"> 
                <img src="images/wind.png">
                
                <div>
                    <p class="wind"> 50km/hr</p>
                    <p> wind speed </p>
                </div>

             </div>
           </div>

             </div>
        </div> 
        
        
    </div>
      

</body>
